name: Build AppImage

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y wget tar

      - name: Make build script executable
        run: chmod +x build-appimage.sh

      - name: Build AppImage
        run: ./build-appimage.sh

      - name: Locate built AppImage
        id: locate
        run: |
          FILE=$(ls "$HOME"/AppImages/*.AppImage | head -n1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "Built: $FILE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Sound-Keeper-AppImage
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

      # Only runs when the workflow is triggered by pushing a tag like v1.0.0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
